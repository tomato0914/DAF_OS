<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAF OS Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>DAF OS Dashboard</h1>
    <div class="subtitle">Digital Asset Factory — CEO View</div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost auto-refresh-btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">🔄 自動更新: ON</button>
    <span class="status-dot" id="statusDot"></span>
    <span class="updated-time" id="updatedTime">読み込み中...</span>
  </div>
</header>

<!-- タブナビゲーション -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('dashboard')">📊 ダッシュボード</button>
  <button class="tab-btn" onclick="switchTab('approvals')" id="tabApprovals">
    ✅ 承認センター <span class="tab-badge" id="pendingBadge" style="display:none"></span>
  </button>
</nav>

<!-- ダッシュボードタブ -->
<main class="container" id="tabDashboard">
  <div class="spinner full">
    <div class="spin"></div>
    <span>ダッシュボードを読み込んでいます...</span>
  </div>
</main>

<!-- 承認センタータブ -->
<main class="container" id="tabApprovalCenter" style="display:none">
  <div class="card full" id="approvalContent">
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
</main>

<!-- 却下理由モーダル -->
<div class="modal-backdrop" id="rejectModal" style="display:none">
  <div class="modal">
    <div class="modal-title">❌ 却下理由を入力</div>
    <div class="modal-subtitle" id="rejectTargetTitle"></div>
    <textarea class="reject-reason" id="rejectReason" placeholder="却下の理由を入力してください（省略可）" rows="4"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeRejectModal()">キャンセル</button>
      <button class="btn btn-danger" onclick="submitReject()">却下する</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────
// タブ切り替え
// ────────────────────────────────

let currentTab = 'dashboard';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tabDashboard').style.display       = tab === 'dashboard' ? '' : 'none';
  document.getElementById('tabApprovalCenter').style.display  = tab === 'approvals' ? '' : 'none';
  event.currentTarget.classList.add('active');
  if (tab === 'approvals') fetchApprovals();
}

// ────────────────────────────────
// ダッシュボードレンダラー
// ────────────────────────────────

function stateClass(state) {
  if (!state) return 'none';
  if (state.includes('✅') || state.includes('完了')) return 'ok';
  if (state.includes('⏳') || state.includes('生成中')) return 'wait';
  if (state.includes('🔴') || state.includes('対応待ち') || state.includes('🔔') || state.includes('要確認')) return 'wait';
  return 'none';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function stripMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/`(.+?)`/g, '$1')
    .replace(/\[(.+?)\]\(.+?\)/g, '$1');
}

function renderStatus(rows) {
  if (!rows || rows.length === 0) return '<p style="color:var(--muted);font-size:.85rem">データなし</p>';
  // ラベルまたは値が欠けている（undefined/空）統計項目は表示しない
  const valid = rows.filter(r => {
    const label = r['項目'] || Object.values(r)[0];
    const num   = Object.values(r)[1];
    return label !== undefined && label !== '' && num !== undefined && num !== '';
  });
  if (valid.length === 0) return '<p style="color:var(--muted);font-size:.85rem">データなし</p>';
  return `<div class="status-grid">` + valid.map(r => {
    const num   = Object.values(r)[1];
    const state = Object.values(r)[2] || '';
    return `<div class="stat-box">
      <div class="stat-label">${esc(r['項目'] || Object.values(r)[0])}</div>
      <div class="stat-value ${stateClass(state)}">${esc(num)}</div>
      <div class="stat-state">${esc(state)}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderActions(actions) {
  if (!actions || actions.length === 0)
    return '<p style="color:var(--muted);font-size:.85rem">アクションなし</p>';
  return `<ul class="actions-list">` + actions.map((a, i) =>
    `<li class="action-item"><span class="action-num">${i+1}</span><span>${esc(stripMarkdown(a))}</span></li>`
  ).join('') + '</ul>';
}

function renderProposal(text) {
  if (!text) return '<p style="color:var(--muted);font-size:.85rem">提案なし</p>';
  return `<div class="proposal-text">${esc(text).replace(/\n/g,'<br>')}</div>`;
}

function renderProgress(blocks, agents) {
  let html = '<div class="progress-list">';
  (blocks || []).forEach(b => {
    html += `<div class="progress-item">
      <div class="progress-header">
        <span class="progress-label">${esc(b.label)}</span>
        <span class="progress-pct">${esc(b.pct)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Number(b.pct)}%"></div></div>
      <div class="progress-detail">${esc(b.detail)}</div>
    </div>`;
  });
  html += '</div>';
  if (agents && agents.length > 0) {
    html += '<div style="margin-top:16px"><div class="card-title">AI社員稼働状況</div><div class="agents-grid">';
    agents.forEach(a => {
      html += `<span class="agent-chip ${a.active ? 'active' : 'inactive'}">
        ${a.active ? '✅' : '⬜'} ${esc(a.name)}</span>`;
    });
    html += '</div></div>';
  }
  return html;
}

function renderGitHub(issues, enabled) {
  if (!enabled || issues.length === 0) {
    const msg = enabled
      ? 'Open Issue はありません。'
      : '<code>GITHUB_TOKEN</code> を .env に追加するとOpen Issueがここに表示されます。';
    return `<div class="gh-disabled">${msg}</div>`;
  }
  return `<table class="issues-table">
    <thead><tr><th>#</th><th>タイトル</th></tr></thead>
    <tbody>` +
    issues.map(i =>
      `<tr>
        <td class="issue-num"><a href="${esc(i.url)}" target="_blank">#${Number(i.number)}</a></td>
        <td><a href="${esc(i.url)}" target="_blank">${esc(i.title)}</a></td>
      </tr>`
    ).join('') + `</tbody></table>`;
}

function renderCeoBriefCard(brief) {
  if (!brief) {
    return `
      <div class="card full ceo-brief-card">
        <div class="card-title">☀️ CEO Daily Brief</div>
        <div class="ceo-brief-empty">未生成 — 次回 <code>python main.py</code> 実行後に表示されます。</div>
      </div>
    `;
  }
  const actionsHtml = (brief.actions || []).map((a, i) =>
    `<li class="action-item"><span class="action-num">${i + 1}</span><span>${esc(stripMarkdown(a))}</span></li>`
  ).join('');
  return `
    <div class="card full ceo-brief-card">
      <div class="card-title">☀️ CEO Daily Brief</div>
      <div class="ceo-brief-updated">最終更新: ${esc(brief.updated)}</div>
      <div class="ceo-brief-grid">
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">📦 プロダクト状況</div>
          <div class="ceo-brief-text">${esc(brief.products).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">⚡ 最優先事項 TOP3</div>
          <div class="ceo-brief-text">${esc(brief.priorities).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">🚀 実装準備状況</div>
          <div class="ceo-brief-text">${esc(brief.implementation).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">🤔 迷っているIssue</div>
          <div class="ceo-brief-text">${esc(brief.undecided || '現在、判断に迷っているIssueはありません。').replace(/\n/g, '<br>')}</div>
        </div>
      </div>
      <div class="ceo-brief-block-title" style="margin-top:14px">📋 今日やること（3つまで）</div>
      <ul class="actions-list">${actionsHtml}</ul>
      <div class="ceo-brief-message">🌱 ${esc(brief.message)}</div>
    </div>
  `;
}

function renderDashboard(data) {
  if (data.error) {
    document.getElementById('tabDashboard').innerHTML =
      `<div class="card full error-box">⚠️ ${esc(data.error)}</div>`;
    return;
  }
  document.getElementById('updatedTime').textContent = '更新: ' + (data.updated || '—');

  // 承認バッジ更新
  const pending = (data.pending_approvals || []).length;
  const badge = document.getElementById('pendingBadge');
  if (pending > 0) {
    badge.textContent = pending;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  const html = `
    ${renderCeoBriefCard(data.ceo_brief)}
    <div class="card full">
      <div class="card-title">今日の状況</div>
      ${renderStatus(data.status)}
    </div>
    <div class="card">
      <div class="card-title">次にCEOがやること</div>
      ${renderActions(data.actions)}
    </div>
    <div class="card">
      <div class="card-title">最新のAI提案</div>
      ${renderProposal(data.proposal)}
    </div>
    <div class="card">
      <div class="card-title">進捗バー</div>
      ${renderProgress(data.progress, data.agents)}
    </div>
    <div class="card">
      <div class="card-title">GitHub Open Issues</div>
      ${renderGitHub(data.github_issues, data.github_enabled)}
    </div>
    ${data.memory_suggestions ? `
    <div class="card full memory-banner">
      <div class="card-title">メモリ見直し提案</div>
      <div class="memory-notice">
        💡 <strong>AIからの提案があります</strong> — 会社メモリの見直し候補が生成されました。
        <span class="memory-hint">承認センタータブまたは outputs/memory_update_suggestions.md を確認してください。</span>
      </div>
    </div>` : ''}
    ${renderProductsCard(data.products)}
    ${renderProductIssueStatsCard(data.product_issue_stats)}
    ${renderLauncherCard(data.approved_implementation_count)}
    ${renderAutonomousFlowCard(data.autonomous_flow)}
    ${renderPrDraftCard(data.pr_draft)}
  `;
  document.getElementById('tabDashboard').innerHTML = html;
}

function renderLauncherCard(count) {
  const n = Number(count) || 0;
  const disabled = n === 0 ? 'disabled' : '';
  return `
    <div class="card full launcher-card">
      <div class="card-title">🚀 ワンクリック実装準備</div>
      <div class="launcher-notice">
        承認済みの実装アイテム <strong>${n}件</strong> から、Claude Code にそのまま貼り付けられる
        実装プロンプト（<code>outputs/claude_code_prompt.md</code>）を生成します。
        commit / push / Claude Codeの自動起動は行いません。
      </div>
      <button class="btn btn-launch" id="launchBtn" onclick="startImplementation()" ${disabled}>
        🚀 実装開始
      </button>
      <div id="launcherResult" class="launcher-result"></div>
    </div>
  `;
}

function startImplementation() {
  const btn = document.getElementById('launchBtn');
  const resultEl = document.getElementById('launcherResult');
  btn.disabled = true;
  btn.textContent = '⏳ 準備中...';
  resultEl.textContent = '';
  resultEl.className = 'launcher-result';

  fetch('/api/start_implementation', { method: 'POST' })
    .then(r => r.json().then(data => ({ status: r.status, data })))
    .then(({ data }) => {
      if (data.ok) {
        resultEl.className = 'launcher-result ok';
        resultEl.textContent = `✅ ${data.message}` + (data.opened ? '（ファイルを開きました）' : '');
        fetchDashboard();
      } else {
        resultEl.className = 'launcher-result error';
        resultEl.textContent = `⚠️ ${data.message}`;
      }
    })
    .catch(e => {
      resultEl.className = 'launcher-result error';
      resultEl.textContent = `⚠️ エラー: ${e}`;
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '🚀 実装開始';
    });
}

function renderProductIssueStatsCard(stats) {
  if (!stats || stats.length === 0) return '';
  const rows = stats.map(s => {
    let mark = '✅';
    let markCls = '';
    if (!s.registered) { mark = '⚠️ 未登録'; markCls = 'product-row-warn'; }
    else if (!s.path_exists) { mark = '⚠️ パスなし'; markCls = 'product-row-warn'; }
    return `
      <div class="product-issue-row ${markCls}">
        <span class="product-issue-name">📦 ${esc(s.product)}</span>
        <span class="product-issue-counts">Issue: ${Number(s.issue_count)} / キュー内: ${Number(s.queued_count)}</span>
        <span class="product-issue-status">${mark}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="card full">
      <div class="card-title">📦 プロダクト別Issue状況</div>
      <div class="products-list">${rows}</div>
    </div>
  `;
}

function renderProductsCard(products) {
  if (!products || products.length === 0) return '';
  const rows = products.map(p => `
    <div class="product-row ${p.path_exists ? '' : 'product-row-warn'}">
      <div class="product-row-head">
        <span class="product-name">${esc(p.name)}</span>
        <span class="product-status">${esc(p.status)}</span>
      </div>
      <div class="product-meta">
        <span class="product-type">${esc(p.type)}</span>
        <span class="product-path">${p.path_exists ? '✅' : '⚠️'} <code>${esc(p.path)}</code></span>
      </div>
      <div class="product-desc">${esc(p.description)}</div>
      ${!p.path_exists ? '<div class="product-warn-notice">⚠️ 指定されたパスが見つかりません。products/*.md の path を確認してください。</div>' : ''}
    </div>
  `).join('');
  return `
    <div class="card full products-card">
      <div class="card-title">🏢 管理中プロダクト</div>
      <div class="products-list">${rows}</div>
    </div>
  `;
}

function renderAutonomousFlowCard(flow) {
  if (!flow) return '';
  const issueRows = (flow.issues || []).map(i => `
    <li class="action-item">
      <span class="action-num">#${esc(i.number)}</span>
      <span>
        ${esc(i.title)}（担当: ${esc(i.assignee)}）
        <span class="flow-product-tag">📦 ${esc(i.product)} <code>${esc(i.work_dir)}</code></span>
        ${i.product_warning ? `<span class="flow-product-warn">${esc(i.product_warning)}</span>` : ''}
      </span>
    </li>
  `).join('');
  return `
    <div class="card full flow-card">
      <div class="card-title">🤖 実装準備完了</div>
      <div class="flow-notice">
        承認済みの実装アイテム <strong>${Number(flow.count)}件</strong> について、
        Claude Code 向けの実装指示書が生成されました。
      </div>
      <ul class="actions-list">${issueRows}</ul>
      <div class="pr-draft-notice">
        📄 <code>outputs/autonomous_flow.md</code> を開き、指示書をClaude Codeに貼り付けて実装してください。
        実装後は commit / push / PR作成を手動で行い、<code>outputs/pr_draft.md</code> を確認してください。
      </div>
    </div>
  `;
}

function renderPrDraftCard(pr) {
  if (!pr) return '';
  return `
    <div class="card full pr-draft-card">
      <div class="card-title">🔀 PR作成準備あり</div>
      <div class="pr-draft-meta">
        <div class="pr-draft-row"><span class="pr-draft-label">生成日時</span><span>${esc(pr.generated_at)}</span></div>
        <div class="pr-draft-row"><span class="pr-draft-label">変更ファイル数</span><span>${Number(pr.file_count)}件</span></div>
        <div class="pr-draft-row"><span class="pr-draft-label">推奨ブランチ名</span><code>${esc(pr.branch_name)}</code></div>
        <div class="pr-draft-row"><span class="pr-draft-label">PRタイトル案</span><span>${esc(pr.pr_title)}</span></div>
      </div>
      <div class="pr-draft-notice">⚠️ commit / push / PR作成は自動実行されません。<code>outputs/pr_draft.md</code> を確認の上、手動で行ってください。</div>
      <details class="ac-preview">
        <summary>コミットメッセージ案を見る</summary>
        <pre class="ac-pre">${esc(pr.commit_message)}</pre>
      </details>
    </div>
  `;
}

// ────────────────────────────────
// 承認センター
// ────────────────────────────────

let _pendingRejectId = null;

function openRejectModal(id, title) {
  _pendingRejectId = id;
  document.getElementById('rejectTargetTitle').textContent = title;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').style.display = 'flex';
  document.getElementById('rejectReason').focus();
}

function closeRejectModal() {
  _pendingRejectId = null;
  document.getElementById('rejectModal').style.display = 'none';
}

function submitReject() {
  if (!_pendingRejectId) return;
  const reason = document.getElementById('rejectReason').value.trim() || '（理由なし）';
  doReject(_pendingRejectId, reason);
  closeRejectModal();
}

function doApprove(id) {
  fetch('/api/approvals/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id}),
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) fetchApprovals();
    else alert('承認に失敗しました: ' + (res.error || ''));
  })
  .catch(e => alert('エラー: ' + e));
}

function doReject(id, reason) {
  fetch('/api/approvals/reject', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, reason}),
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) fetchApprovals();
    else alert('却下に失敗しました: ' + (res.error || ''));
  })
  .catch(e => alert('エラー: ' + e));
}

function typeLabel(type) {
  if (type === 'memory_review')  return { icon: '🧠', label: 'メモリ見直し', cls: 'type-memory' };
  if (type === 'implementation') return { icon: '⚡', label: '実装キュー',   cls: 'type-impl'   };
  return { icon: '📋', label: type, cls: '' };
}

function renderAdvisorBlock(advisor) {
  if (!advisor) return '';
  const reasonHtml = esc(advisor.reason || '').replace(/\n/g, '<br>');
  return `
    <div class="advisor-block">
      <div class="advisor-title">🤖 AIアドバイス</div>
      <div class="advisor-row"><span class="advisor-label">優先度</span><span>${esc(advisor.priority_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">工数</span><span>${esc(advisor.effort_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">リスク</span><span>${esc(advisor.risk_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">推奨</span><span class="advisor-action advisor-action-${esc(advisor.action)}">${esc(advisor.action_label)}</span></div>
      <div class="advisor-reason">${reasonHtml}</div>
    </div>
  `;
}

function renderApprovals(data) {
  const pending  = data.pending  || [];
  const approved = data.approved_count || 0;
  const rejected = data.rejected_count || 0;

  // バッジ更新
  const badge = document.getElementById('pendingBadge');
  if (pending.length > 0) { badge.textContent = pending.length; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';

  let html = `
    <div class="approval-summary">
      <div class="approval-stat">
        <span class="as-num warn">${pending.length}</span>
        <span class="as-label">承認待ち</span>
      </div>
      <div class="approval-stat">
        <span class="as-num ok">${approved}</span>
        <span class="as-label">承認済み</span>
      </div>
      <div class="approval-stat">
        <span class="as-num muted">${rejected}</span>
        <span class="as-label">却下済み</span>
      </div>
    </div>
  `;

  if (pending.length === 0) {
    html += `<div class="approval-empty">✅ 承認待ちアイテムはありません</div>`;
  } else {
    html += `<div class="approval-items">`;
    pending.forEach(item => {
      const t = typeLabel(item.type);
      const preview = (item.preview || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `
        <div class="approval-card" id="ac-${esc(item.id)}">
          <div class="ac-header">
            <div class="ac-meta">
              <span class="ac-icon">${t.icon}</span>
              <span class="ac-type ${t.cls}">${t.label}</span>
            </div>
            <div class="ac-btns">
              <button class="btn btn-approve" onclick="doApprove('${esc(item.id)}')">✅ 承認</button>
              <button class="btn btn-reject"  onclick="openRejectModal('${esc(item.id)}','${esc(item.title)}')">❌ 却下</button>
            </div>
          </div>
          <div class="ac-title">${esc(item.title)}</div>
          ${renderAdvisorBlock(item.advisor)}
          <details class="ac-preview" data-approval-id="${esc(item.id)}">
            <summary>内容を確認</summary>
            <pre class="ac-pre">${preview}</pre>
          </details>
        </div>
      `;
    });
    html += `</div>`;
  }

  document.getElementById('approvalContent').innerHTML = html;
}

// 開いている <details data-approval-id> の id 一覧を返す（再描画前に呼ぶ）
function _getOpenApprovalDetails() {
  return Array.from(document.querySelectorAll('#approvalContent details[open]'))
    .map(el => el.dataset.approvalId)
    .filter(Boolean);
}

// 再描画後、以前開いていた id の <details> を再度開く
function _restoreOpenApprovalDetails(openIds) {
  if (!openIds || openIds.length === 0) return;
  openIds.forEach(id => {
    const el = document.querySelector(`#approvalContent details[data-approval-id="${CSS.escape(id)}"]`);
    if (el) el.open = true;
  });
}

function fetchApprovals() {
  const openIds = _getOpenApprovalDetails();
  fetch('/api/approvals')
    .then(r => r.json())
    .then(data => {
      renderApprovals(data);
      _restoreOpenApprovalDetails(openIds);
    })
    .catch(e => {
      document.getElementById('approvalContent').innerHTML =
        `<div class="error-box">⚠️ 承認データの取得に失敗しました: ${esc(String(e))}</div>`;
    });
}

// ────────────────────────────────
// 自動更新（デフォルト30秒ごと。ON/OFF切り替え可能）
// ────────────────────────────────

let autoRefreshEnabled = true;
const AUTO_REFRESH_INTERVAL_MS = 30000;
let _dashboardTimer = null;
let _approvalsTimer = null;

function toggleAutoRefresh() {
  autoRefreshEnabled = !autoRefreshEnabled;
  const btn = document.getElementById('autoRefreshBtn');
  btn.textContent = autoRefreshEnabled ? '🔄 自動更新: ON' : '⏸ 自動更新: OFF';
  btn.classList.toggle('is-off', !autoRefreshEnabled);
}

function fetchDashboard() {
  fetch('/api/data')
    .then(r => r.json())
    .then(data => {
      renderDashboard(data);
      document.getElementById('statusDot').style.background = 'var(--success)';
      document.getElementById('statusDot').style.boxShadow = '0 0 6px var(--success)';
    })
    .catch(() => {
      document.getElementById('statusDot').style.background = 'var(--danger)';
      document.getElementById('statusDot').style.boxShadow = '0 0 6px var(--danger)';
    });
}

// キーボード: Esc でモーダルを閉じる
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeRejectModal();
});
// モーダル背景クリックで閉じる
document.getElementById('rejectModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeRejectModal();
});

fetchDashboard();
_dashboardTimer = setInterval(() => { if (autoRefreshEnabled) fetchDashboard(); }, AUTO_REFRESH_INTERVAL_MS);
_approvalsTimer = setInterval(() => { if (autoRefreshEnabled && currentTab === 'approvals') fetchApprovals(); }, AUTO_REFRESH_INTERVAL_MS);
</script>
</body>
</html>
