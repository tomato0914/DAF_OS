<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAF OS Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>DAF OS Dashboard</h1>
    <div class="subtitle">Digital Asset Factory — CEO View</div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost auto-refresh-btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">🔄 自動更新: ON</button>
    <span class="status-dot" id="statusDot"></span>
    <span class="updated-time" id="updatedTime">読み込み中...</span>
  </div>
</header>

<!-- タブナビゲーション -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 ダッシュボード</button>
  <button class="tab-btn" data-tab="approvals" onclick="switchTab('approvals')" id="tabApprovals">
    ✅ 承認センター <span class="tab-badge" id="pendingBadge" style="display:none"></span>
  </button>
  <button class="tab-btn" data-tab="projects" onclick="switchTab('projects')" id="tabProjects">🗂️ プロジェクト</button>
  <button class="tab-btn" data-tab="assets" onclick="switchTab('assets')" id="tabAssets">🎨 生成物</button>
  <button class="tab-btn" data-tab="notifications" onclick="switchTab('notifications')" id="tabNotifications">🔔 通知</button>
  <button class="tab-btn" data-tab="references" onclick="switchTab('references')" id="tabReferences">🖼️ 参考画像</button>
  <button class="tab-btn" data-tab="ipmemory" onclick="switchTab('ipmemory')" id="tabIpMemory">🧬 キャラクター管理</button>
</nav>

<!-- ダッシュボードタブ -->
<main class="container" id="tabDashboard">
  <div class="spinner full">
    <div class="spin"></div>
    <span>ダッシュボードを読み込んでいます...</span>
  </div>
</main>

<!-- 承認センタータブ -->
<main class="container" id="tabApprovalCenter" style="display:none">
  <div class="card full" id="approvalContent">
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
</main>

<!-- プロジェクトタブ（Quest93） -->
<main class="container" id="tabProjectCenter" style="display:none">
  <div class="card full">
    <div class="card-title">🆕 新規プロジェクト</div>
    <div class="project-form">
      <label class="project-form-label">プロジェクト名</label>
      <input type="text" class="project-input" id="newProjectName" placeholder="例：犬のLINEスタンプ販売">

      <label class="project-form-label">種類</label>
      <select class="project-input" id="newProjectAssetType">
        <option value="line_sticker">line_sticker</option>
        <option value="youtube_short">youtube_short</option>
        <option value="blog">blog</option>
        <option value="ebook">ebook</option>
        <option value="ios_app">ios_app</option>
        <option value="saas">saas</option>
        <option value="generic">generic</option>
      </select>

      <label class="project-form-label">ビジョン</label>
      <textarea class="project-input" id="newProjectVision" rows="2" placeholder="例：犬好きの人が毎日使いたくなるLINEスタンプを作る。"></textarea>

      <label class="project-form-label">成功指標（1行に1つ）</label>
      <textarea class="project-input" id="newProjectMetrics" rows="3" placeholder="1作品公開&#10;販売10件&#10;月100円売上"></textarea>

      <button class="btn btn-approve" id="createProjectBtn" onclick="createProject()">作成</button>
    </div>
  </div>

  <div class="card full" id="projectListContent">
    <div class="card-title">🗂️ Project一覧</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
</main>

<!-- Generated Assetsタブ（Dashboard v1試験運用版） -->
<main class="container" id="tabAssetCenter" style="display:none">
  <div class="card full" id="assetListContent">
    <div class="card-title">🎨 生成物</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
  <!-- Image Renderer表示（Quest98：将来Renderer切替できる設計の入口を可視化） -->
  <div class="card full" id="rendererInfoContent" style="display:none"></div>
  <!-- LINEスタンプ Project別成果物一覧（Quest94 v2で追加、Quest97でProject別対応） -->
  <div class="card full" id="lineStickerProjectListContent">
    <div class="card-title">🐶 LINEスタンプ Project別成果物</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
  <!-- 選択したProjectの詳細（「詳細を見る」クリックで表示） -->
  <div class="card full" id="lineStickerDetailContent" style="display:none"></div>
</main>

<!-- Notificationsタブ（Dashboard v1試験運用版） -->
<main class="container" id="tabNotificationCenter" style="display:none">
  <div class="card full" id="notificationListContent">
    <div class="card-title">🔔 通知</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
</main>

<!-- Referencesタブ（Quest102） -->
<main class="container" id="tabReferenceCenter" style="display:none">
  <div class="card full">
    <div class="card-title">🎨 参考画像をアップロード</div>
    <div class="project-form">
      <label class="project-form-label">画像ファイル（png / jpg / jpeg / webp）</label>
      <input type="file" class="project-input" id="refUploadFile" accept=".png,.jpg,.jpeg,.webp">

      <label class="project-form-label">Category</label>
      <select class="project-input" id="refUploadCategory"></select>

      <label class="project-form-label">Project</label>
      <select class="project-input" id="refUploadProject">
        <option value="">（未紐づけ）</option>
      </select>

      <label class="project-form-label">Tags（カンマ区切り）</label>
      <input type="text" class="project-input" id="refUploadTags" placeholder="例：犬, かわいい, パステル">

      <label class="project-form-label">Description</label>
      <textarea class="project-input" id="refUploadDescription" rows="2" placeholder="例：丸い目、やさしい色、シンプルな線"></textarea>

      <button class="btn btn-approve" id="refUploadBtn" onclick="uploadReferenceImage()">アップロード</button>
    </div>
  </div>

  <div class="card full">
    <div class="card-title">🧾 Reference Summary</div>
    <button class="btn" id="refSummaryRefreshBtn" onclick="refreshReferenceSummary()">🔄 Summary Refresh</button>
    <div id="refSummaryRefreshResult"></div>
  </div>

  <div class="card full" id="referenceListContent">
    <div class="card-title">🖼️ Reference一覧</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>
</main>

<!-- IP Memoryタブ（Quest104） -->
<main class="container" id="tabIpMemoryCenter" style="display:none">
  <div class="card full">
    <div class="card-title">🆕 New IP</div>
    <div class="project-form">
      <label class="project-form-label">IP名</label>
      <input type="text" class="project-input" id="ipNewName" placeholder="例：mofu">
      <button class="btn btn-approve" id="ipCreateBtn" onclick="createIp()">作成</button>
    </div>
  </div>

  <div class="card full" id="ipListContent">
    <div class="card-title">🧬 IP一覧</div>
    <div class="spinner"><div class="spin"></div><span>読み込み中...</span></div>
  </div>

  <div class="card full" id="ipDnaContent" style="display:none"></div>
</main>

<!-- 却下理由モーダル -->
<div class="modal-backdrop" id="rejectModal" style="display:none">
  <div class="modal">
    <div class="modal-title">❌ 却下理由を入力</div>
    <div class="modal-subtitle" id="rejectTargetTitle"></div>
    <textarea class="reject-reason" id="rejectReason" placeholder="却下の理由を入力してください（省略可）" rows="4"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeRejectModal()">キャンセル</button>
      <button class="btn btn-danger" onclick="submitReject()">却下する</button>
    </div>
  </div>
</div>

<!-- Quest96：スタンプ拡大表示（ライトボックス） -->
<div class="modal-backdrop" id="stampLightbox" style="display:none" onclick="closeLightboxOnBackdrop(event)">
  <div class="modal lightbox-modal">
    <div class="lightbox-header">
      <span id="lightboxCounter">1 / 40</span>
      <button class="btn btn-ghost" onclick="closeLightbox()">✕ 閉じる</button>
    </div>
    <img id="lightboxImage" class="lightbox-image" src="" alt="">
    <div class="lightbox-actions">
      <button class="btn" onclick="lightboxPrev()">◀ 前へ</button>
      <a class="btn btn-approve" id="lightboxDownload" href="" download>⬇ ダウンロード</a>
      <button class="btn" onclick="lightboxNext()">次へ ▶</button>
    </div>
    <div class="lightbox-rating">
      <button class="lightbox-rate-btn" id="lightboxRate_good" onclick="rateCurrentStamp('good')">👍 良い</button>
      <button class="lightbox-rate-btn" id="lightboxRate_redo" onclick="rateCurrentStamp('redo')">🔄 再生成候補</button>
      <button class="lightbox-rate-btn" id="lightboxRate_fav" onclick="rateCurrentStamp('fav')">⭐ お気に入り</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────
// タブ切り替え
// ────────────────────────────────

let currentTab = 'dashboard';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tabDashboard').style.display       = tab === 'dashboard' ? '' : 'none';
  document.getElementById('tabApprovalCenter').style.display  = tab === 'approvals' ? '' : 'none';
  document.getElementById('tabProjectCenter').style.display   = tab === 'projects' ? '' : 'none';
  document.getElementById('tabAssetCenter').style.display     = tab === 'assets' ? '' : 'none';
  document.getElementById('tabNotificationCenter').style.display = tab === 'notifications' ? '' : 'none';
  document.getElementById('tabReferenceCenter').style.display = tab === 'references' ? '' : 'none';
  document.getElementById('tabIpMemoryCenter').style.display = tab === 'ipmemory' ? '' : 'none';
  // タブボタン以外（CEOサマリーのタイルなど）から呼ばれても安全なように、
  // 暗黙の event を使わず data-tab 属性で対象ボタンを探す
  const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  if (tab === 'approvals') fetchApprovals();
  if (tab === 'projects') fetchProjects();
  if (tab === 'assets') { fetchGeneratedAssets(); fetchLineStickerProjects(); fetchRendererInfo(); }
  if (tab === 'notifications') fetchNotifications();
  if (tab === 'references') fetchReferences();
  if (tab === 'ipmemory') fetchIps();
}

// ────────────────────────────────
// ダッシュボードレンダラー
// ────────────────────────────────

// Quest52: 会議実行中は自動更新による全体再描画で入力内容・結果が消えないようにする
let meetingBusy = false;
let lastMeetingResult = null; // { ok, message, meeting_log, input }

function stateClass(state) {
  if (!state) return 'none';
  if (state.includes('✅') || state.includes('完了')) return 'ok';
  if (state.includes('⏳') || state.includes('生成中')) return 'wait';
  if (state.includes('🔴') || state.includes('対応待ち') || state.includes('🔔') || state.includes('要確認')) return 'wait';
  return 'none';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function stripMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/`(.+?)`/g, '$1')
    .replace(/\[(.+?)\]\(.+?\)/g, '$1');
}

function renderStatus(rows) {
  if (!rows || rows.length === 0) return '<p style="color:var(--muted);font-size:.85rem">データなし</p>';
  // ラベルまたは値が欠けている（undefined/空）統計項目は表示しない
  const valid = rows.filter(r => {
    const label = r['項目'] || Object.values(r)[0];
    const num   = Object.values(r)[1];
    return label !== undefined && label !== '' && num !== undefined && num !== '';
  });
  if (valid.length === 0) return '<p style="color:var(--muted);font-size:.85rem">データなし</p>';
  return `<div class="status-grid">` + valid.map(r => {
    const num   = Object.values(r)[1];
    const state = Object.values(r)[2] || '';
    return `<div class="stat-box">
      <div class="stat-label">${esc(r['項目'] || Object.values(r)[0])}</div>
      <div class="stat-value ${stateClass(state)}">${esc(num)}</div>
      <div class="stat-state">${esc(state)}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderActions(actions) {
  if (!actions || actions.length === 0)
    return '<p style="color:var(--muted);font-size:.85rem">アクションなし</p>';
  return `<ul class="actions-list">` + actions.map((a, i) =>
    `<li class="action-item"><span class="action-num">${i+1}</span><span>${esc(stripMarkdown(a))}</span></li>`
  ).join('') + '</ul>';
}

function renderProposal(text) {
  if (!text) return '<p style="color:var(--muted);font-size:.85rem">提案なし</p>';
  return `<div class="proposal-text">${esc(text).replace(/\n/g,'<br>')}</div>`;
}

function renderProgress(blocks, agents) {
  let html = '<div class="progress-list">';
  (blocks || []).forEach(b => {
    html += `<div class="progress-item">
      <div class="progress-header">
        <span class="progress-label">${esc(b.label)}</span>
        <span class="progress-pct">${esc(b.pct)}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Number(b.pct)}%"></div></div>
      <div class="progress-detail">${esc(b.detail)}</div>
    </div>`;
  });
  html += '</div>';
  if (agents && agents.length > 0) {
    html += '<div style="margin-top:16px"><div class="card-title">AI社員稼働状況</div><div class="agents-grid">';
    agents.forEach(a => {
      html += `<span class="agent-chip ${a.active ? 'active' : 'inactive'}">
        ${a.active ? '✅' : '⬜'} ${esc(a.name)}</span>`;
    });
    html += '</div></div>';
  }
  return html;
}

function renderGitHub(issues, enabled) {
  if (!enabled || issues.length === 0) {
    const msg = enabled
      ? 'Open Issue はありません。'
      : '<code>GITHUB_TOKEN</code> を .env に追加するとOpen Issueがここに表示されます。';
    return `<div class="gh-disabled">${msg}</div>`;
  }
  return `<div class="table-scroll"><table class="issues-table">
    <thead><tr><th>#</th><th>タイトル</th></tr></thead>
    <tbody>` +
    issues.map(i =>
      `<tr>
        <td class="issue-num"><a href="${esc(i.url)}" target="_blank">#${Number(i.number)}</a></td>
        <td><a href="${esc(i.url)}" target="_blank">${esc(i.title)}</a></td>
      </tr>`
    ).join('') + `</tbody></table></div>`;
}

function renderReflectionCard(reflection) {
  if (!reflection) {
    return `
      <div class="card full reflection-card">
        <div class="card-title">🪞 振り返り（Reflection Summary）</div>
        <div class="reflection-empty">まだ振り返りデータはありません</div>
      </div>
    `;
  }

  const renderList = (items) => {
    if (!items || items.length === 0) {
      return '<div class="reflection-empty">データなし</div>';
    }
    return '<ul class="reflection-list">' + items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>';
  };

  return `
    <div class="card full reflection-card">
      <div class="card-title">🪞 振り返り（Reflection Summary）</div>
      <div class="reflection-section">
        <div class="reflection-section-title">✅ 成功した判断</div>
        ${renderList(reflection.success)}
      </div>
      <div class="reflection-section">
        <div class="reflection-section-title">⚠️ 改善が必要な判断</div>
        ${renderList(reflection.needs_review)}
      </div>
      <div class="reflection-section">
        <div class="reflection-section-title">📌 次回会議への反映</div>
        ${renderList(reflection.next_meeting)}
      </div>
    </div>
  `;
}

function renderCeoBriefCard(brief) {
  if (!brief) {
    return `
      <div class="card full ceo-brief-card">
        <div class="card-title">☀️ CEO Daily Brief</div>
        <div class="ceo-brief-empty">未生成 — 次回 <code>python main.py</code> 実行後に表示されます。</div>
      </div>
    `;
  }
  const actionsHtml = (brief.actions || []).map((a, i) =>
    `<li class="action-item"><span class="action-num">${i + 1}</span><span>${esc(stripMarkdown(a))}</span></li>`
  ).join('');
  return `
    <div class="card full ceo-brief-card">
      <div class="card-title">☀️ CEO Daily Brief</div>
      <div class="ceo-brief-updated">最終更新: ${esc(brief.updated)}</div>
      <div class="ceo-brief-grid">
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">📦 プロダクト状況</div>
          <div class="ceo-brief-text">${esc(brief.products).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">⚡ 最優先事項 TOP3</div>
          <div class="ceo-brief-text">${esc(brief.priorities).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">🚀 実装準備状況</div>
          <div class="ceo-brief-text">${esc(brief.implementation).replace(/\n/g, '<br>')}</div>
        </div>
        <div class="ceo-brief-block">
          <div class="ceo-brief-block-title">🤔 迷っているIssue</div>
          <div class="ceo-brief-text">${esc(brief.undecided || '現在、判断に迷っているIssueはありません。').replace(/\n/g, '<br>')}</div>
        </div>
      </div>
      <div class="ceo-brief-block-title" style="margin-top:14px">📋 今日やること（3つまで）</div>
      <ul class="actions-list">${actionsHtml}</ul>
      <div class="ceo-brief-message">🌱 ${esc(brief.message)}</div>
    </div>
  `;
}

// Dashboard最新化（Quest80〜87の生成物）：Markdown本文をそのままカード表示する。
// v1のためMarkdown→HTML変換はせず、.ac-pre（折り返し・スクロール対応）にそのまま流し込む。
function renderRawMarkdownCard(title, emoji, content, accentClass) {
  if (!content) {
    return `
      <div class="card full ${accentClass || ''}">
        <div class="card-title">${emoji} ${esc(title)}</div>
        <div class="ceo-brief-empty">まだ生成されていません。</div>
      </div>
    `;
  }
  return `
    <div class="card full ${accentClass || ''}">
      <div class="card-title">${emoji} ${esc(title)}</div>
      <pre class="ac-pre">${esc(content)}</pre>
    </div>
  `;
}

function renderCeoInboxCard(content) {
  return renderRawMarkdownCard('CEO Inbox', '📥', content, 'card-accent-red');
}
function renderCapitalAllocationCard(content) {
  return renderRawMarkdownCard('Capital Allocation', '💰', content, 'card-accent-yellow');
}
function renderIssuePipelineCard(content) {
  return renderRawMarkdownCard('Issue Pipeline', '🛠️', content, 'card-accent-blue');
}
function renderWeeklyBoardMeetingCard(content) {
  return renderRawMarkdownCard('Weekly Board Meeting', '📅', content, 'card-accent-purple');
}
function renderSelfImprovementCard(content) {
  return renderRawMarkdownCard('Self Improvement Suggestions', '🌱', content, 'card-accent-green');
}

function renderMeetingCard() {
  const busyAttr = meetingBusy ? 'disabled' : '';
  const btnLabel = meetingBusy ? '⏳ 会議中...（数十秒〜数分かかります）' : '🤖 経営会議を開始';
  const inputValue = meetingBusy && lastMeetingResult ? esc(lastMeetingResult.input) : '';

  let resultHtml = '';
  if (lastMeetingResult && !meetingBusy) {
    if (lastMeetingResult.ok) {
      resultHtml = `<div class="meeting-result ok"><pre class="meeting-log-output">${esc(lastMeetingResult.meeting_log)}</pre></div>`;
    } else {
      resultHtml = `<div class="meeting-result error">⚠️ ${esc(lastMeetingResult.message)}</div>`;
    }
  }

  return `
    <div class="card full meeting-card card-accent-blue">
      <div class="card-title">💬 DAFに相談</div>
      <div class="meeting-notice">
        相談内容をAI経営会議（Sirius/Nova/Cosmos/Atlas/Orion）に渡し、各自の判断基準・会社メモリを踏まえて回答します。
        ⚠️ 相談結果は直近の <code>outputs/meeting_log.md</code> を上書きします。数十秒〜数分かかります。
      </div>
      <textarea id="meetingInput" class="meeting-input" rows="3" placeholder="例：来月の優先施策について相談したい" ${busyAttr}>${inputValue}</textarea>
      <button class="btn btn-launch" id="meetingBtn" onclick="startMeeting()" ${busyAttr}>${btnLabel}</button>
      <div id="meetingResult">${resultHtml}</div>
    </div>
  `;
}

function startMeeting() {
  const input = document.getElementById('meetingInput');
  const message = input.value.trim();

  if (!message) {
    lastMeetingResult = { ok: false, message: '相談内容を入力してください' };
    renderDashboard(_lastDashboardData || {});
    return;
  }

  meetingBusy = true;
  lastMeetingResult = { input: message };
  renderDashboard(_lastDashboardData || {});

  fetch('/api/meeting/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  })
    .then(r => r.json().then(data => ({ status: r.status, data })))
    .then(({ data }) => {
      lastMeetingResult = data.ok
        ? { ok: true, meeting_log: data.meeting_log }
        : { ok: false, message: data.message };
    })
    .catch(e => {
      lastMeetingResult = { ok: false, message: `エラー: ${e}` };
    })
    .finally(() => {
      meetingBusy = false;
      fetchDashboard();
    });
}

// ────────────────────────────────
// Quest117：CEO Mode（Think Less. Decide More.）
// CEOが毎日見る画面を「① 今日やること → ② AI社員からの重要報告 →
// ③ 進行中Project → ④ 要承認事項 → ⑤ 最近完了した制作」の優先順位で
// 並べる。技術的な詳細（API・Prompt・Production Step・Quality Score詳細等）
// はCEO Homeには出さず、末尾の「🔧 詳細情報を見る」内へ集約する。
// ────────────────────────────────

function _ceoTodayAction(data) {
  // 今日の最重要アクション：CEO Daily Brief優先、無ければ「次にCEOがやること」にフォールバック
  return (data.ceo_brief && data.ceo_brief.actions && data.ceo_brief.actions[0]) ||
    (data.actions && data.actions[0]) ||
    '現在、緊急のアクションはありません。';
}

function renderTodayActionCard(data) {
  const action = stripMarkdown(_ceoTodayAction(data));
  const openrouterWarning = data.openrouter_warning
    ? `<div class="ceo-summary-warning">⚠️ ${esc(data.openrouter_warning)}</div>`
    : '';
  return `
    <div class="card full ceo-summary-card">
      <div class="card-title">① 今日やること</div>
      <div class="ceo-summary-headline">
        <span class="ceo-summary-headline-icon">👉</span>
        <div class="ceo-summary-headline-body">
          <div class="ceo-summary-headline-text">${esc(action)}</div>
        </div>
      </div>
      ${openrouterWarning}
    </div>
  `;
}

function _countCeoInboxReports(text) {
  if (!text) return 0;
  const matches = text.match(/^- /gm);
  return matches ? matches.length : 0;
}

function renderAiReportsCard(ceoInboxText) {
  const count = _countCeoInboxReports(ceoInboxText);
  const message = count > 0 ? `AI社員から${count}件の報告があります` : 'AI社員からの新しい報告はありません';
  return `
    <div class="card full">
      <div class="card-title">② AI社員からの重要報告</div>
      <div class="creative-direction-text">${esc(message)}</div>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="openCeoInboxDetails()">Inboxを見る</button>
    </div>
  `;
}

function openCeoInboxDetails() {
  const details = document.getElementById('dashboardDetailsSection');
  if (details) details.open = true;
  const anchor = document.getElementById('ceoInboxCardAnchor');
  if (anchor) anchor.scrollIntoView({ behavior: 'smooth' });
}

function renderApprovalsSummaryCard(count) {
  const message = count > 0 ? `要承認：${count}件` : '要承認事項はありません';
  return `
    <div class="card full">
      <div class="card-title">④ 要承認事項</div>
      <div class="creative-direction-text">${esc(message)}</div>
      <button class="btn btn-approve" style="margin-top:8px" onclick="switchTab('approvals')">承認センターへ</button>
    </div>
  `;
}

function fetchApprovalsSummary() {
  // dashboard.md（レガシー日次バッチ）が未生成でも要承認件数が正しく出るよう、
  // 承認センターと同じ /api/approvals を直接参照する（Quest117）。
  fetch('/api/approvals')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('ceoApprovalsContainer');
      if (el) el.innerHTML = renderApprovalsSummaryCard((data.pending || []).length);
    })
    .catch(() => {
      const el = document.getElementById('ceoApprovalsContainer');
      if (el) el.innerHTML = renderApprovalsSummaryCard(0);
    });
}

function renderCompletedCard(items) {
  if (!items || items.length === 0) return '';
  const rows = items.map(i => `
    <div class="completed-row">
      <span class="completed-row-title">✅ ${esc(i.title)}</span>
      <span class="completed-row-meta">${esc(i.completed_at || '')}</span>
      ${i.github_url ? `<a class="completed-row-link" href="${esc(i.github_url)}" target="_blank">GitHub Issue ＞</a>` : ''}
    </div>
  `).join('');
  return `
    <div class="card full card-accent-green">
      <div class="card-title">🟢 完了済み（${items.length}件）</div>
      <div class="products-list">${rows}</div>
    </div>
  `;
}

// Quest117：CEO Homeに出す5項目＋Review Package以外（旧v1パイプライン・
// AI社員向け生レポート・開発者向けログ等）を1つの折りたたみへ集約する
// 共通パーツ。data.error（dashboard.md未生成）の場合でも同じ構成にする。
function _dashboardDetailsSectionHtml(data) {
  const logSection = data.error ? '' : `
    <details class="card full log-section">
      <summary><span class="card-title">📋 ログ・補足情報</span></summary>
      <div class="log-section-body">
        <div class="card full">
          <div class="card-title">今日の状況</div>
          ${renderStatus(data.status)}
        </div>
        <div class="card">
          <div class="card-title">次にCEOがやること</div>
          ${renderActions(data.actions)}
        </div>
        <div class="card">
          <div class="card-title">最新のAI提案</div>
          ${renderProposal(data.proposal)}
        </div>
        <div class="card">
          <div class="card-title">進捗バー</div>
          ${renderProgress(data.progress, data.agents)}
        </div>
        <div class="card">
          <div class="card-title">GitHub Open Issues</div>
          ${renderGitHub(data.github_issues, data.github_enabled)}
        </div>
        ${data.memory_suggestions ? `
        <div class="card full memory-banner">
          <div class="card-title">メモリ見直し提案</div>
          <div class="memory-notice">
            💡 <strong>AIからの提案があります</strong> — 会社メモリの見直し候補が生成されました。
            <span class="memory-hint">承認センタータブまたは outputs/memory_update_suggestions.md を確認してください。</span>
          </div>
        </div>` : ''}
        ${renderProductsCard(data.products)}
        ${renderProductIssueStatsCard(data.product_issue_stats)}
      </div>
    </details>
  `;

  return `
    <details class="card full developer-mode" id="dashboardDetailsSection">
      <summary>🔧 詳細情報を見る（開発者・AI社員レポート）</summary>
      <div style="margin-top:14px">
        ${renderFactoryPanelCard()}
        <div id="latestArtifactContainer"></div>
        <div id="creativeDirectionContainer"></div>
        <div id="referenceLibraryContainer"></div>

        <div id="ceoInboxCardAnchor">${renderCeoInboxCard(data.ceo_inbox)}</div>
        ${renderCapitalAllocationCard(data.capital_allocation)}
        ${renderIssuePipelineCard(data.issue_pipeline)}
        ${renderWeeklyBoardMeetingCard(data.weekly_board_meeting)}
        ${renderSelfImprovementCard(data.self_improvement)}

        ${renderMeetingCard()}
        ${renderCeoBriefCard(data.ceo_brief)}
        ${renderReflectionCard(data.reflection)}
        ${renderLauncherCard(data.approved_implementation_count)}
        ${renderAutonomousFlowCard(data.autonomous_flow)}
        ${renderCompletedCard(data.completed_items)}
        ${renderPrDraftCard(data.pr_draft)}

        ${data.error ? `<div class="card full error-box">⚠️ ${esc(data.error)}</div>` : ''}
        ${logSection}
      </div>
    </details>
  `;
}

function renderDashboard(data) {
  // Quest117（CEO Mode）：CEOが毎日見る画面は「① 今日やること →
  // ② AI社員からの重要報告 → ③ 進行中Project → ④ 要承認事項 →
  // ⑤ 最近完了した制作」の優先順位で並べ、Review Packageへもここから
  // アクセスできるようにする。レガシーなdashboard.md（今日の状況・進捗
  // バー等）が無くても①②④は常に表示できるため、Quest96同様
  // data.errorの有無に関わらず同じ構成を使う。
  document.getElementById('updatedTime').textContent = '更新: ' + (data.updated || '—');

  // 承認バッジ更新
  const pending = (data.pending_approvals || []).length;
  const badge = document.getElementById('pendingBadge');
  if (pending > 0) {
    badge.textContent = pending;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  const html = `
    ${renderTodayActionCard(data)}
    ${renderAiReportsCard(data.ceo_inbox)}
    <div id="ceoHomeContainer"></div>
    <div id="ceoApprovalsContainer"></div>
    <div id="ceoRecentProductionsContainer"></div>
    ${renderReviewPackageCard()}

    ${_dashboardDetailsSectionHtml(data)}
  `;
  document.getElementById('tabDashboard').innerHTML = html;
  fetchCeoHome();
  fetchApprovalsSummary();
  fetchLatestArtifact();
  fetchCreativeDirection();
  fetchReferenceLibrary();
}

function renderLauncherCard(count) {
  const n = Number(count) || 0;
  const disabled = n === 0 ? 'disabled' : '';
  return `
    <div class="card full launcher-card card-accent-blue">
      <div class="card-title">🔵 実装準備完了（ワンクリック実装準備）</div>
      <div class="launcher-notice">
        承認済みの実装アイテム <strong>${n}件</strong> から、Claude Code にそのまま貼り付けられる
        実装プロンプト（<code>outputs/claude_code_prompt.md</code>）を生成します。
        commit / push / Claude Codeの自動起動は行いません。
      </div>
      <button class="btn btn-launch" id="launchBtn" onclick="startImplementation()" ${disabled}>
        実装プロンプトを作成
      </button>
      <div id="launcherResult" class="launcher-result"></div>
    </div>
  `;
}

function startImplementation() {
  const btn = document.getElementById('launchBtn');
  const resultEl = document.getElementById('launcherResult');
  btn.disabled = true;
  btn.textContent = '⏳ 準備中...';
  resultEl.textContent = '';
  resultEl.className = 'launcher-result';

  fetch('/api/start_implementation', { method: 'POST' })
    .then(r => r.json().then(data => ({ status: r.status, data })))
    .then(({ data }) => {
      if (data.ok) {
        resultEl.className = 'launcher-result ok';
        resultEl.textContent = `✅ ${data.message}` + (data.opened ? '（ファイルを開きました）' : '');
        fetchDashboard();
      } else {
        resultEl.className = 'launcher-result error';
        resultEl.textContent = `⚠️ ${data.message}`;
      }
    })
    .catch(e => {
      resultEl.className = 'launcher-result error';
      resultEl.textContent = `⚠️ エラー: ${e}`;
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '実装プロンプトを作成';
    });
}

function renderProductIssueStatsCard(stats) {
  if (!stats || stats.length === 0) return '';
  const rows = stats.map(s => {
    let mark = '✅';
    let markCls = '';
    if (!s.registered) { mark = '⚠️ 未登録'; markCls = 'product-row-warn'; }
    else if (!s.path_exists) { mark = '⚠️ パスなし'; markCls = 'product-row-warn'; }
    return `
      <div class="product-issue-row ${markCls}">
        <span class="product-issue-name">📦 ${esc(s.product)}</span>
        <span class="product-issue-counts">Issue: ${Number(s.issue_count)} / キュー内: ${Number(s.queued_count)}</span>
        <span class="product-issue-status">${mark}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="card full">
      <div class="card-title">📦 プロダクト別Issue状況</div>
      <div class="products-list">${rows}</div>
    </div>
  `;
}

function renderProductsCard(products) {
  if (!products || products.length === 0) return '';
  const rows = products.map(p => `
    <div class="product-row ${p.path_exists ? '' : 'product-row-warn'}">
      <div class="product-row-head">
        <span class="product-name">${esc(p.name)}</span>
        <span class="product-status">${esc(p.status)}</span>
      </div>
      <div class="product-meta">
        <span class="product-type">${esc(p.type)}</span>
        <span class="product-path">${p.path_exists ? '✅' : '⚠️'} <code>${esc(p.path)}</code></span>
      </div>
      <div class="product-desc">${esc(p.description)}</div>
      ${!p.path_exists ? '<div class="product-warn-notice">⚠️ 指定されたパスが見つかりません。products/*.md の path を確認してください。</div>' : ''}
    </div>
  `).join('');
  return `
    <div class="card full products-card">
      <div class="card-title">🏢 管理中プロダクト</div>
      <div class="products-list">${rows}</div>
    </div>
  `;
}

function renderAutonomousFlowCard(flow) {
  if (!flow) return '';
  const issueRows = (flow.issues || []).map(i => `
    <li class="action-item flow-issue-row">
      <span class="action-num">#${esc(i.number)}</span>
      <span class="flow-issue-body">
        ${esc(i.title)}（担当: ${esc(i.assignee)}）
        <span class="state-badge badge-purple">🟣 実装完了待ち</span>
        <span class="flow-product-tag">📦 ${esc(i.product)} <code>${esc(i.work_dir)}</code></span>
        ${i.product_warning ? `<span class="flow-product-warn">${esc(i.product_warning)}</span>` : ''}
      </span>
      <div class="flow-issue-btns">
        <button class="btn btn-launch-one" onclick="startImplementationFor('${esc(i.approval_id)}', this)">Issue実装プロンプトを作成</button>
        <button class="btn btn-complete" onclick="completeImplementation('${esc(i.approval_id)}', this)">✅ 実装完了</button>
      </div>
    </li>
  `).join('');
  return `
    <div class="card full flow-card card-accent-purple">
      <div class="card-title">🟣 実装完了待ち</div>
      <div class="flow-notice">
        承認済みの実装アイテム <strong>${Number(flow.count)}件</strong> について、
        Claude Code 向けの実装指示書が生成されました。
        「Issue実装プロンプトを作成」を押すと、そのIssueだけを対象にした <code>claude_code_prompt.md</code> が生成されます。
        実装が終わったら「✅ 実装完了」でこのリストから外してください。
      </div>
      <ul class="actions-list">${issueRows}</ul>
      <div class="pr-draft-notice">
        📄 <code>outputs/autonomous_flow.md</code> を開き、指示書をClaude Codeに貼り付けて実装してください。
        実装後は commit / push / PR作成を手動で行い、<code>outputs/pr_draft.md</code> を確認してください。
      </div>
    </div>
  `;
}

function startImplementationFor(approvalId, btnEl) {
  if (!approvalId) return;
  const original = btnEl ? btnEl.textContent : '';
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳ 準備中...'; }

  fetch('/api/start_implementation', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({approval_ids: [approvalId]}),
  })
  .then(r => r.json().then(data => ({ status: r.status, data })))
  .then(({ data }) => {
    if (data.ok) {
      alert(`✅ ${data.message}` + (data.opened ? '（ファイルを開きました）' : ''));
    } else {
      alert('⚠️ ' + data.message);
    }
  })
  .catch(e => alert('エラー: ' + e))
  .finally(() => {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = original; }
  });
}

function completeImplementation(approvalId, btnEl) {
  if (!approvalId) return;
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳ 処理中...'; }

  fetch('/api/approvals/complete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: approvalId}),
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) {
      fetchDashboard();
    } else {
      alert('実装完了処理に失敗しました: ' + (res.error || ''));
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = '✅ 実装完了'; }
    }
  })
  .catch(e => {
    alert('エラー: ' + e);
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '✅ 実装完了'; }
  });
}

function renderPrDraftCard(pr) {
  if (!pr) return '';
  return `
    <div class="card full pr-draft-card">
      <div class="card-title">🔀 PR作成準備あり</div>
      <div class="pr-draft-meta">
        <div class="pr-draft-row"><span class="pr-draft-label">生成日時</span><span>${esc(pr.generated_at)}</span></div>
        <div class="pr-draft-row"><span class="pr-draft-label">変更ファイル数</span><span>${Number(pr.file_count)}件</span></div>
        <div class="pr-draft-row"><span class="pr-draft-label">推奨ブランチ名</span><code>${esc(pr.branch_name)}</code></div>
        <div class="pr-draft-row"><span class="pr-draft-label">PRタイトル案</span><span>${esc(pr.pr_title)}</span></div>
      </div>
      <div class="pr-draft-notice">⚠️ commit / push / PR作成は自動実行されません。<code>outputs/pr_draft.md</code> を確認の上、手動で行ってください。</div>
      <details class="ac-preview">
        <summary>コミットメッセージ案を見る</summary>
        <pre class="ac-pre">${esc(pr.commit_message)}</pre>
      </details>
    </div>
  `;
}

// ────────────────────────────────
// 承認センター
// ────────────────────────────────

let _pendingRejectId = null;

function openRejectModal(id, title) {
  _pendingRejectId = id;
  document.getElementById('rejectTargetTitle').textContent = title;
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').style.display = 'flex';
  document.getElementById('rejectReason').focus();
}

function closeRejectModal() {
  _pendingRejectId = null;
  document.getElementById('rejectModal').style.display = 'none';
}

function submitReject() {
  if (!_pendingRejectId) return;
  const reason = document.getElementById('rejectReason').value.trim() || '（理由なし）';
  doReject(_pendingRejectId, reason);
  closeRejectModal();
}

function doApprove(id) {
  fetch('/api/approvals/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id}),
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) fetchApprovals();
    else alert('承認に失敗しました: ' + (res.error || ''));
  })
  .catch(e => alert('エラー: ' + e));
}

function doReject(id, reason) {
  fetch('/api/approvals/reject', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id, reason}),
  })
  .then(r => r.json())
  .then(res => {
    if (res.ok) fetchApprovals();
    else alert('却下に失敗しました: ' + (res.error || ''));
  })
  .catch(e => alert('エラー: ' + e));
}

function typeLabel(type) {
  if (type === 'memory_review')  return { icon: '🧠', label: 'メモリ見直し', cls: 'type-memory' };
  if (type === 'implementation') return { icon: '⚡', label: '実装キュー',   cls: 'type-impl'   };
  return { icon: '📋', label: type, cls: '' };
}

function renderConfidenceBlock(item) {
  if (item.confidence === undefined || item.confidence === null) return '';
  const confidence = Number(item.confidence);
  const cls = confidence >= 70 ? 'confidence-high' : confidence >= 40 ? 'confidence-mid' : 'confidence-low';
  return `
    <div class="confidence-block ${cls}">
      <div class="confidence-title">📊 Confidence: ${confidence}%</div>
      <div class="confidence-reason">理由：${esc(item.confidence_reason || '')}</div>
    </div>
  `;
}

function renderAdvisorBlock(advisor) {
  if (!advisor) return '';
  const reasonHtml = esc(advisor.reason || '').replace(/\n/g, '<br>');
  return `
    <div class="advisor-block">
      <div class="advisor-title">🤖 AIアドバイス</div>
      <div class="advisor-row"><span class="advisor-label">優先度</span><span>${esc(advisor.priority_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">工数</span><span>${esc(advisor.effort_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">リスク</span><span>${esc(advisor.risk_label)}</span></div>
      <div class="advisor-row"><span class="advisor-label">推奨</span><span class="advisor-action advisor-action-${esc(advisor.action)}">${esc(advisor.action_label)}</span></div>
      <div class="advisor-reason">${reasonHtml}</div>
    </div>
  `;
}

function renderHistorySection(historyId, icon, label, items, colorClass) {
  const count = (items || []).length;
  const rows = count === 0
    ? `<div class="history-empty">該当するIssueはありません</div>`
    : items.map(i => `
        <div class="history-row">
          <div class="history-row-head">
            ${i.issue_number ? `<span class="history-issue-num">#${esc(i.issue_number)}</span>` : ''}
            <span class="history-title">${esc(stripMarkdown(i.title || ''))}</span>
          </div>
          <div class="history-row-meta">
            ${i.product ? `<span class="history-chip">📦 ${esc(i.product)}</span>` : ''}
            <span class="history-chip">🕒 ${esc(i.timestamp || i.completed_at || '')}</span>
            ${i.reason ? `<span class="history-chip history-reason">理由: ${esc(i.reason)}</span>` : ''}
            ${i.github_url ? `<a class="history-link" href="${esc(i.github_url)}" target="_blank">GitHub Issue ＞</a>` : ''}
          </div>
        </div>
      `).join('');

  return `
    <details class="history-section ${colorClass}" data-history-id="${historyId}">
      <summary>
        <span class="history-summary-icon">${icon}</span>
        <span class="history-summary-label">${label}</span>
        <span class="history-summary-count">${count}</span>
      </summary>
      <div class="history-body">${rows}</div>
    </details>
  `;
}

function renderApprovals(data) {
  const pending   = data.pending  || [];
  // タイルの件数は履歴一覧（approved_items等）の件数と一致させる。
  // approved_count等はディレクトリ内ファイル数の単純カウントのため、
  // 過去データの不整合（旧形式ファイルの混入）があるとズレる可能性があるため。
  const approved  = (data.approved_items  || []).length;
  const rejected  = (data.rejected_items  || []).length;
  const completed = (data.completed_items || []).length;

  // バッジ更新
  const badge = document.getElementById('pendingBadge');
  if (pending.length > 0) { badge.textContent = pending.length; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';

  let html = `
    <div class="approval-summary">
      <div class="approval-stat">
        <span class="as-num warn">${pending.length}</span>
        <span class="as-label">承認待ち</span>
      </div>

            </div>
          </div>
          <div class="ac-title">${esc(item.title)}</div>
          ${renderConfidenceBlock(item)}
          ${renderAdvisorBlock(item.advisor)}

            <pre class="ac-pre">${preview}</pre>

  document.getElementById('approvalContent').innerHTML = html;
}

// 開いている <details data-approval-id> / <details data-history-id> の id 一覧を返す（再描画前に呼ぶ）
function _getOpenApprovalDetails() {
  return Array.from(document.querySelectorAll('#approvalContent details[open]'))
    .map(el => el.dataset.approvalId || (el.dataset.historyId && `history:${el.dataset.historyId}`))
    .filter(Boolean);
}

// 再描画後、以前開いていた id の <details> を再度開く
function _restoreOpenApprovalDetails(openIds) {
  if (!openIds || openIds.length === 0) return;
  openIds.forEach(id => {
    if (id.startsWith('history:')) {
      const historyId = id.slice('history:'.length);
      const el = document.querySelector(`#approvalContent details[data-history-id="${CSS.escape(historyId)}"]`);
      if (el) el.open = true;
      return;
    }
    const el = document.querySelector(`#approvalContent details[data-approval-id="${CSS.escape(id)}"]`);
    if (el) el.open = true;
  });
}

// 承認済み／却下済み／実装完了の件数タイルをクリックしたときに、対応するアコーディオンを開閉する
function toggleHistorySection(historyId) {
  const el = document.querySelector(`details[data-history-id="${CSS.escape(historyId)}"]`);
  if (!el) return;
  el.open = !el.open;
  if (el.open) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fetchApprovals() {
  const openIds = _getOpenApprovalDetails();
  fetch('/api/approvals')
    .then(r => r.json())
    .then(data => {
      renderApprovals(data);
      _restoreOpenApprovalDetails(openIds);
    })
    .catch(e => {
      document.getElementById('approvalContent').innerHTML =
        `<div class="error-box">⚠️ 承認データの取得に失敗しました: ${esc(String(e))}</div>`;
    });
}

// 1プロジェクトぶんのNext Actionを決める（CEO Homeの優先順位ルールを
// プロジェクト単位に縮小したもの）。
function _projectNextAction(project, pendingReviewAssetTypes, hasPendingImplementation) {
  if (project.status === 'archived' || project.status === 'completed') return '-';
  if (pendingReviewAssetTypes.has(project.asset_type)) return `${project.asset_type} をレビューしてください。`;
  if (hasPendingImplementation) return '実装待ちIssueを確認してください。';
  if (project.status === 'active') return 'Execution Planを確認してください。';
  return '-';
}

function fetchProjects() {
  Promise.all([
    fetch('/api/projects').then(r => r.json()),
    fetch('/api/generated-assets').then(r => r.json()),
    fetch('/api/dashboard/home').then(r => r.json()),
  ])
    .then(([projectsData, assetsData, homeData]) => {
      const pendingReviewAssetTypes = new Set(
        (assetsData.assets || []).filter(a => a.status === 'pending_review').map(a => a.asset_type)
      );
      const hasPendingImplementation = (homeData.pending_implementation || 0) > 0;
      const projects = projectsData.projects || [];

      // Quest114：Project行に「⬇ ZIPダウンロード」を出すかどうかの判定用に、
      // 各Projectの提出用ZIP有無をあわせて取得する（既存の/export-report
      // をそのまま再利用、新規APIは追加しない）。
      Promise.all(
        projects.map(p =>
          fetch(`/api/projects/${encodeURIComponent(p.id)}/export-report`)
            .then(r => r.json())
            .catch(() => ({ exists: false }))
        )
      ).then(exportReports => {
        const zipByProjectId = {};
        projects.forEach((p, i) => {
          const report = (exportReports[i] || {}).report;
          if (report && report.zip_file) zipByProjectId[p.id] = report.zip_file;
        });
        renderProjects(projects, pendingReviewAssetTypes, hasPendingImplementation, zipByProjectId);
      });
    })
    .catch(e => {
      document.getElementById('projectListContent').innerHTML =
        `<div class="error-box">⚠️ Projectデータの取得に失敗しました: ${esc(String(e))}</div>`;
    });
}

const QUALITY_STATUS_ICON = { PASS: '✅', WARNING: '⚠️', FAIL: '❌' };

function renderQualityReport(projectId, report) {
  const container = document.getElementById('qualityCheckResultContent');
  if (!container) return;

  const overallIcon = report.passed ? '✅ PASS' : '❌ FAIL';
  const rows = (report.checks || []).map(c => `
    <tr>
      <td>${esc(c.name)}</td>
      <td>${QUALITY_STATUS_ICON[c.status] || ''} ${esc(c.status)}</td>
      <td>${esc(c.detail || '')}</td>
    </tr>
  `).join('');

  container.innerHTML = `
    <div class="card full">
      <div class="card-title">🧪 Quality Report（${esc(projectId)}）</div>
      <div class="creative-direction-text">${overallIcon}　Score: ${Number(report.score || 0)} / 100</div>
      <div class="table-scroll" style="margin-top:8px">
        <table class="simple-table">
          <thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function runQualityCheck(projectId, btnEl) {
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '⏳ 判定中...'; }

  fetch('/api/quality/check', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ asset_type: 'line_sticker', project_id: projectId }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        renderQualityReport(projectId, data.report);
      } else {
        const container = document.getElementById('qualityCheckResultContent');
        if (container) container.innerHTML = `<div class="card full error-box">⚠️ Quality Checkに失敗しました: ${esc(data.error || '')}</div>`;
      }
    })
    .catch(e => {
      const container = document.getElementById('qualityCheckResultContent');
      if (container) container.innerHTML = `<div class="card full error-box">⚠️ Project ${esc(projectId)}：Quality Checkでエラーが発生しました: ${esc(String(e))}</div>`;
    })
    .finally(() => {
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = '🧪 Run Quality Check'; }
    });
}

const NOTIFICATION_LEVEL_BADGE = {
  critical: '<span class="state-badge badge-yellow">🔴 critical</span>',
  warning:  '<span class="state-badge badge-yellow">🟠 warning</span>',
  info:     '<span class="state-badge badge-blue">🔵 info</span>',
  success:  '<span class="state-badge badge-green">🟢 success</span>',
};

function renderNotifications(notifications) {
  const list = notifications || [];
  let html = '<div class="card-title">🔔 通知</div>';

  if (list.length === 0) {
    html += '<div class="ceo-brief-empty">まだ通知はありません。</div>';
  } else {
    html += `
      <div class="table-scroll">
      <table class="simple-table">
        <thead><tr><th>Time</th><th>Level</th><th>Message</th></tr></thead>
        <tbody>
    `;
    list.forEach(n => {
      const badge = NOTIFICATION_LEVEL_BADGE[n.level] || esc(n.level);
      html += `
        <tr>
          <td>${esc(n.timestamp)}</td>
          <td>${badge}</td>
          <td class="notif-message-cell">${esc(n.message)}</td>
        </tr>
      `;
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('notificationListContent').innerHTML = html;
}

function fetchNotifications() {
  fetch('/api/notifications')
    .then(r => r.json())
    .then(data => renderNotifications(data.notifications))
    .catch(e => {
      document.getElementById('notificationListContent').innerHTML =
        `<div class="error-box">⚠️ 通知の取得に失敗しました: ${esc(String(e))}</div>`;
    });
}

// ────────────────────────────────
// Quest96：ワンクリック生成（🚀 スタンプを作る）＋ 最新成果物カード
// 既存の /api/projects/create・/api/projects/generate-assets・
// /api/generated-assets 系エンドポイント（Quest93〜94で実装済み）をそのまま
// 順番に呼び出すだけで完結させる（バックエンドの新規変更は不要）。
// ────────────────────────────────

const FACTORY_STEPS = [
  { key: 'project', label: 'Project作成' },
  { key: 'plan', label: 'Execution Plan生成' },
  { key: 'asset', label: 'Asset生成' },
  { key: 'review', label: 'Review一覧更新' },
  { key: 'assets_list', label: 'Generated Assets一覧更新' },
];

const FACTORY_STEP_ICONS = { idle: '⬜', active: '⏳', done: '✅', error: '❌' };

function renderFactoryPanelCard() {
  const steps = FACTORY_STEPS.map(s => `
    <div class="factory-step" id="factoryStep_${s.key}" data-state="idle">
      <span class="factory-step-icon">⬜</span>
      <span class="factory-step-label">${s.label}</span>
    </div>
  `).join('');

  return `
    <details class="card full factory-panel developer-mode">
      <summary>🔧 旧機能 / Developer Mode（旧スタンプ生成パイプライン）</summary>
      <div class="card-title" style="margin-top:10px">🏭 DAF 制御盤（旧UI）</div>
      <p class="factory-panel-desc">
        Quest96時代の旧パイプラインです。現在の推奨導線は🗂️ プロジェクトタブの
        「🚀 このProjectを制作する」です。ボタン1つで「Project作成 → Execution Plan生成 →
        Asset生成 → レビュー確認」まで一気に進めます。
      </p>
      <button class="btn btn-factory" id="oneClickStampBtn" onclick="startOneClickStamp()">旧スタンプ生成（Developer）</button>
      <div class="factory-progress" id="factoryProgress" style="display:none">${steps}</div>
      <div class="factory-result" id="factoryResult"></div>
    </details>
  `;
}

function _setFactoryStep(key, state) {
  const el = document.getElementById(`factoryStep_${key}`);
  if (!el) return;
  el.dataset.state = state;
  const icon = el.querySelector('.factory-step-icon');
  if (icon) icon.textContent = FACTORY_STEP_ICONS[state] || '⬜';
}

function _resetFactoryProgress() {
  FACTORY_STEPS.forEach(s => _setFactoryStep(s.key, 'idle'));
  const result = document.getElementById('factoryResult');
  if (result) result.innerHTML = '';
  const progress = document.getElementById('factoryProgress');
  if (progress) progress.style.display = '';
}

function _factoryError(message) {
  const result = document.getElementById('factoryResult');
  if (result) result.innerHTML = `<div class="error-box">⚠️ ${esc(message)}</div>`;
}

function startOneClickStamp() {
  const btn = document.getElementById('oneClickStampBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  _resetFactoryProgress();

  const label = new Date().toLocaleString('ja-JP', {
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
  });
  const projectName = `犬のLINEスタンプ ${label}`;

  _setFactoryStep('project', 'active');

  fetch('/api/projects/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: projectName,
      asset_type: 'line_sticker',
      vision: '犬好きの人が毎日使いたくなるLINEスタンプを作る。',
      success_metrics: ['1作品公開'],
    }),
  })
    .then(r => r.json().then(data => ({ status: r.status, data })))
    .then(({ data }) => {
      if (!data.ok) {
        _setFactoryStep('project', 'error');
        _factoryError(data.error || 'Projectの作成に失敗しました');
        throw new Error('__factory_stop__');
      }
      _setFactoryStep('project', 'done');
      _setFactoryStep('plan', 'active');
      _setFactoryStep('asset', 'active');

      return fetch('/api/projects/generate-assets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: data.id }),
      });
    })
    .then(r => r.json().then(data => ({ status: r.status, data })))
    .then(({ data }) => {
      if (!data.ok) {
        _setFactoryStep('plan', 'error');
        _setFactoryStep('asset', 'error');
        _factoryError(data.error || `Asset生成に失敗しました（status: ${data.status || 'unknown'}）`);
        throw new Error('__factory_stop__');
      }
      _setFactoryStep('plan', 'done');
      _setFactoryStep('asset', 'done');
      _setFactoryStep('review', 'active');

      return fetch('/api/generated-assets/line-sticker').then(r => r.json());
    })
    .then(() => {
      _setFactoryStep('review', 'done');
      _setFactoryStep('assets_list', 'active');
      return Promise.all([
        fetch('/api/generated-assets').then(r => r.json()),
        fetch('/api/notifications').then(r => r.json()),
        fetch('/api/dashboard/home').then(r => r.json()),
      ]);
    })
    .then(() => {
      _setFactoryStep('assets_list', 'done');
      const result = document.getElementById('factoryResult');
      if (result) result.innerHTML = '<div class="factory-success">🎉 LINEスタンプ生成完了</div>';

      // 開いている可能性のあるタブ・CEO Home・最新成果物カードを最新化する
      fetchLatestArtifact();
      fetchCeoHome();
      fetchCreativeDirection();
      fetchReferenceLibrary();
      if (currentTab === 'projects') fetchProjects();
      if (currentTab === 'assets') {
        fetchGeneratedAssets();
        fetchLineStickerProjects();
        if (_selectedLineStickerProjectId) fetchLineStickerDetail(_selectedLineStickerProjectId);
      }
      if (currentTab === 'notifications') fetchNotifications();
    })
    .catch(e => {
      if (e.message !== '__factory_stop__') {
        _factoryError('エラーが発生しました: ' + e);
      }
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '旧スタンプ生成（Developer）';
    });
}

// Quest102：🎨 References タブ（アップロード・一覧・Summary Refresh）
// 画像解析AIは使わない。タグ・説明文はCEOが手動入力する前提。
// ────────────────────────────────

let _referenceCategories = [];
let _referenceProjects = [];

function _populateReferenceSelects() {
  const catSel = document.getElementById('refUploadCategory');
  if (catSel) {
    catSel.innerHTML = _referenceCategories.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }
  const projSel = document.getElementById('refUploadProject');
  if (projSel) {
    projSel.innerHTML = '<option value="">（未紐づけ）</option>' +
      _referenceProjects.map(p => `<option value="${esc(p.id)}">${esc(p.id)} - ${esc(p.name)}</option>`).join('');
  }
}

let _referenceRaw = [];

function renderReferenceList(references) {
  const list = references || [];
  _referenceRaw = list;
  let html = '<div class="card-title">🖼️ Reference一覧（' + list.length + '件）</div>';

  if (list.length === 0) {
    html += '<div class="ceo-brief-empty">まだ参考画像は登録されていません。上のフォームからアップロードしてください。</div>';
  } else {
    html += `
      <div class="table-scroll">
      <table class="simple-table">
        <thead>
          <tr><th>画像</th><th>Title</th><th>Category</th><th>Project</th><th>Tags</th><th>Description</th><th>登録日時</th><th>AI解析</th></tr>
        </thead>
        <tbody>
    `;
    list.forEach((r, idx) => {
      const imgUrl = `/reference-library/${encodeURIComponent(r.category || '')}/${encodeURIComponent(r.filename || '')}`;
      const tags = (r.tags || []).map(t => `<span class="reference-tag">${esc(t)}</span>`).join(' ');
      html += `
        <tr>
          <td><img src="${imgUrl}" alt="${esc(r.title || r.filename || '')}" class="reference-thumb" onerror="this.style.display='none'"></td>
          <td>${esc(r.title || r.filename || '-')}</td>
          <td>${esc(r.category || '-')}</td>
          <td>${esc(r.project_id || '-')}</td>
          <td>${tags || '-'}</td>
          <td>${esc(r.memo || '-')}</td>
          <td>${esc(r.registered_at || '-')}</td>
          <td><button class="btn btn-ghost" onclick="toggleReferenceEditPanel(${idx})">✨ Analyze / Edit</button></td>
        </tr>
        <tr id="refEditRow_${idx}" class="reference-edit-row" style="display:none">
          <td colspan="8">
            <div class="reference-edit-panel">
              <div class="reference-edit-actions">
                <button class="btn" id="refAnalyzeBtn_${idx}" onclick="analyzeReferenceWithAI(${idx})">🤖 Analyze with AI</button>
                <span class="reference-edit-status" id="refAnalyzeStatus_${idx}"></span>
              </div>
              <label class="project-form-label">Tags（カンマ区切り）</label>
              <input type="text" class="project-input" id="refEditTags_${idx}" value="${esc((r.tags || []).join(', '))}">
              <label class="project-form-label">Animal</label>
              <input type="text" class="project-input" id="refEditAnimal_${idx}" value="${esc(r.animal || '')}">
              <label class="project-form-label">Color</label>
              <input type="text" class="project-input" id="refEditColor_${idx}" value="${esc(r.color || '')}">
              <label class="project-form-label">Mood</label>
              <input type="text" class="project-input" id="refEditMood_${idx}" value="${esc(r.mood || '')}">
              <label class="project-form-label">Memo（Description）</label>
              <textarea class="project-input" id="refEditMemo_${idx}" rows="2">${esc(r.memo || '')}</textarea>
              <button class="btn btn-approve" onclick="saveReferenceAnalysis(${idx})">💾 Save Analysis</button>
              <span class="reference-edit-status" id="refSaveStatus_${idx}"></span>
            </div>
          </td>
        </tr>
      `;
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('referenceListContent').innerHTML = html;
}

function toggleReferenceEditPanel(idx) {
  const row = document.getElementById(`refEditRow_${idx}`);
  if (!row) return;
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

function analyzeReferenceWithAI(idx) {
  const r = _referenceRaw[idx];
  if (!r) return;
  const btn = document.getElementById(`refAnalyzeBtn_${idx}`);
  const statusEl = document.getElementById(`refAnalyzeStatus_${idx}`);
  btn.disabled = true;
  btn.textContent = '⏳ 解析中...';
  statusEl.textContent = '';

  fetch('/api/references/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ category: r.category, filename: r.filename }),
  })
    .then(resp => resp.json())
    .then(data => {
      const a = data.analysis || {};
      document.getElementById(`refEditTags_${idx}`).value = (a.tags || []).join(', ');
      document.getElementById(`refEditAnimal_${idx}`).value = a.animal || '';
      document.getElementById(`refEditColor_${idx}`).value = a.color || '';
      document.getElementById(`refEditMood_${idx}`).value = a.mood || '';
      document.getElementById(`refEditMemo_${idx}`).value = a.memo || '';
      statusEl.textContent = data.success
        ? '✅ AI解析結果を反映しました（内容を確認・編集してSaveしてください）'
        : `⚠️ ${a.memo || data.error || 'AI解析に失敗しました'}`;
    })
    .catch(e => { statusEl.textContent = 'エラー: ' + e; })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '🤖 Analyze with AI';
    });
}

function saveReferenceAnalysis(idx) {
  const r = _referenceRaw[idx];
  if (!r) return;
  const statusEl = document.getElementById(`refSaveStatus_${idx}`);
  const tags = document.getElementById(`refEditTags_${idx}`).value;
  const animal = document.getElementById(`refEditAnimal_${idx}`).value;
  const color = document.getElementById(`refEditColor_${idx}`).value;
  const mood = document.getElementById(`refEditMood_${idx}`).value;
  const memo = document.getElementById(`refEditMemo_${idx}`).value;

  statusEl.textContent = '⏳ 保存中...';
  fetch('/api/references/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ category: r.category, filename: r.filename, tags, animal, color, mood, memo }),
  })
    .then(resp => resp.json())
    .then(data => {
      if (data.ok) {
        statusEl.textContent = '✅ 保存しました';
        fetchReferences();
      } else {
        statusEl.textContent = '⚠️ ' + (data.error || '保存に失敗しました');
      }
    })
    .catch(e => { statusEl.textContent = 'エラー: ' + e; });
}

function fetchReferences() {
  fetch('/api/references')
    .then(r => r.json())
    .then(data => {
      _referenceCategories = data.categories || [];
      _referenceProjects = data.projects || [];
      _populateReferenceSelects();
      renderReferenceList(data.references);
    })
    .catch(e => {
      document.getElementById('referenceListContent').innerHTML =
        `<div class="error-box">⚠️ Reference一覧の取得に失敗しました: ${esc(String(e))}</div>`;
    });
}

      dna[group][field] = el ? el.value : '';

// ────────────────────────────────

const RATING_ICONS = { good: '👍', redo: '🔄', fav: '⭐' };
let _stampRatings = {};

function _loadStampRatings() {
  try {
    _stampRatings = JSON.parse(localStorage.getItem('daf_stamp_ratings') || '{}');
  } catch (e) {
    _stampRatings = {};
  }
}

function _saveStampRatings() {
  try {
    localStorage.setItem('daf_stamp_ratings', JSON.stringify(_stampRatings));
  } catch (e) {
    // localStorageが使えない環境（プライベートモード等）では保存をあきらめるだけで良い
  }
}

_loadStampRatings();

function _updateGridBadge(filename) {
  const badge = document.querySelector(`.sticker-rating-badge[data-filename="${CSS.escape(filename)}"]`);
  if (badge) badge.textContent = _stampRatings[filename] ? RATING_ICONS[_stampRatings[filename]] : '';
}

// ────────────────────────────────
// Quest96：スタンプ拡大表示（ライトボックス）— クリックで拡大・前後移動・
// 現在の枚数表示・ダウンロードボタンを提供する。
// ────────────────────────────────

let _currentStampFiles = [];
let _currentStampBaseUrl = '/generated-assets/line-sticker/';
let _lightboxIndex = 0;

function openLightbox(index) {
  if (!_currentStampFiles.length) return;
  _lightboxIndex = ((index % _currentStampFiles.length) + _currentStampFiles.length) % _currentStampFiles.length;
  const lb = document.getElementById('stampLightbox');
  if (lb) lb.style.display = '';
  _renderLightbox();
}

function closeLightbox() {
  const lb = document.getElementById('stampLightbox');
  if (lb) lb.style.display = 'none';
}

function closeLightboxOnBackdrop(e) {
  if (e.target.id === 'stampLightbox') closeLightbox();
}

function lightboxPrev() { openLightbox(_lightboxIndex - 1); }
function lightboxNext() { openLightbox(_lightboxIndex + 1); }

function _renderLightbox() {
  const filename = _currentStampFiles[_lightboxIndex];
  if (!filename) return;
  const baseUrl = _currentStampBaseUrl;
  const img = document.getElementById('lightboxImage');
  const counter = document.getElementById('lightboxCounter');
  const dl = document.getElementById('lightboxDownload');
  if (img) img.src = baseUrl + encodeURIComponent(filename);
  if (counter) counter.textContent = `${_lightboxIndex + 1} / ${_currentStampFiles.length}`;
  if (dl) {
    dl.href = baseUrl + encodeURIComponent(filename);
    dl.setAttribute('download', filename);
  }
  _renderLightboxRatingButtons(filename);
}

function _renderLightboxRatingButtons(filename) {
  const current = _stampRatings[filename];
  ['good', 'redo', 'fav'].forEach(key => {
    const btn = document.getElementById(`lightboxRate_${key}`);
    if (btn) btn.classList.toggle('active', current === key);
  });
}

function rateCurrentStamp(rating) {
  const filename = _currentStampFiles[_lightboxIndex];
  if (!filename) return;
  if (_stampRatings[filename] === rating) {
    delete _stampRatings[filename]; // 同じ評価を再度押すと解除する
  } else {
    _stampRatings[filename] = rating;
  }
  _saveStampRatings();
  _renderLightboxRatingButtons(filename);
  _updateGridBadge(filename);
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('stampLightbox');
  if (!lb || lb.style.display === 'none') return;
  if (e.key === 'ArrowLeft') lightboxPrev();
  else if (e.key === 'ArrowRight') lightboxNext();
  else if (e.key === 'Escape') closeLightbox();
});

function _fetchProductionReportsSummary() {
  // ⑤ 最近完了した制作 / ③ 制作完了数 の両方に使う。既存の
  // GET /api/projects・GET /api/projects/<id>/production-report を
  // そのまま再利用するだけで、新しい集計APIは追加しない。
  return fetch('/api/projects')
    .then(r => r.json())
    .then(data => {
      const projects = data.projects || [];
      return Promise.all(projects.map(p =>
        fetch(`/api/projects/${encodeURIComponent(p.id)}/production-report`)
          .then(r => r.json())
          .then(res => ({ project: p, report: (res.exists && res.report) ? res.report : null }))
          .catch(() => ({ project: p, report: null }))
      ));
    })
    .then(results => {
      const rows = results
        .filter(({ report }) => report && report.status === 'success')
        .map(({ project, report }) => ({
          project_id: project.id,
          name: project.name,
          asset_type_label: report.asset_type_label || assetTypeLabel(project.asset_type),
          finished_at: report.finished_at,
        }))
        .sort((a, b) => (b.finished_at || '').localeCompare(a.finished_at || ''));
      return { count: rows.length, recent: rows.slice(0, 5) };
    })
    .catch(() => ({ count: 0, recent: [] }));
}

function fetchCeoHome() {
  Promise.all([
    fetch('/api/dashboard/home').then(r => r.json()),
    _fetchProductionReportsSummary(),
  ])
    .then(([home, productions]) => {
      const statsEl = document.getElementById('ceoHomeContainer');
      if (statsEl) statsEl.innerHTML = renderCeoHomeStatsCard(home, productions.count);
      const recentEl = document.getElementById('ceoRecentProductionsContainer');
      if (recentEl) recentEl.innerHTML = renderRecentProductionsCard(productions.recent);
    })
    .catch(() => {
      const el = document.getElementById('ceoHomeContainer');
      if (el) el.innerHTML = '<div class="card full error-box">⚠️ CEO Homeの取得に失敗しました</div>';
    });
}

    <ul class="actions-list">${fileRows}</ul>
    <div style="margin-top:10px">
      <a class="btn btn-approve" href="/api/dashboard/review-package/download/${encodeURIComponent(data.package_id)}" download>⬇ review_package.zip をダウンロード</a>
    </div>
  `;
}

function renderReviewPackageCard() {
  return `
    <div class="card full">
      <div class="card-title">📦 Executive Boardレビュー資料</div>
      <p class="factory-panel-desc">
        現在のDashboard構造・Project状況・制作の進み具合をまとめて出力し、
        Executive Board（CEO／外部レビュー）へ提出できる資料を作成します。
      </p>
      <button class="btn btn-approve" id="reviewPackageBtn" onclick="createReviewPackage()">📦 Executive Boardレビュー資料を作成</button>
      <div id="reviewPackageResult" style="margin-top:10px">${_reviewPackageResultHtml(lastReviewPackageResult)}</div>
    </div>
  `;
}

function createReviewPackage() {
  const btn = document.getElementById('reviewPackageBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 作成中...'; }

  fetch('/api/dashboard/review-package/create', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      lastReviewPackageResult = data;
      const container = document.getElementById('reviewPackageResult');
      if (container) container.innerHTML = _reviewPackageResultHtml(data);
    })
    .catch(e => {
      lastReviewPackageResult = { ok: false, error: String(e) };
      const container = document.getElementById('reviewPackageResult');
      if (container) container.innerHTML = `<div class="error-box">⚠️ エラー: ${esc(String(e))}</div>`;
    })
    .finally(() => {
      if (btn) { btn.disabled = false; btn.textContent = '📦 Executive Boardレビュー資料を作成'; }
    });
}

// ────────────────────────────────
// 自動更新（デフォルト30秒ごと。ON/OFF切り替え可能）
// ────────────────────────────────

let autoRefreshEnabled = true;
const AUTO_REFRESH_INTERVAL_MS = 30000;
let _dashboardTimer = null;
let _approvalsTimer = null;

function toggleAutoRefresh() {
  autoRefreshEnabled = !autoRefreshEnabled;
  const btn = document.getElementById('autoRefreshBtn');
  btn.textContent = autoRefreshEnabled ? '🔄 自動更新: ON' : '⏸ 自動更新: OFF';
  btn.classList.toggle('is-off', !autoRefreshEnabled);
}

let _lastDashboardData = {};

function fetchDashboard() {
  fetch('/api/data')
    .then(r => r.json())
    .then(data => {
      _lastDashboardData = data;
      renderDashboard(data);
      document.getElementById('statusDot').style.background = 'var(--success)';
      document.getElementById('statusDot').style.boxShadow = '0 0 6px var(--success)';
    })
    .catch(() => {
      document.getElementById('statusDot').style.background = 'var(--danger)';
      document.getElementById('statusDot').style.boxShadow = '0 0 6px var(--danger)';
    });
}

// キーボード: Esc でモーダルを閉じる
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeRejectModal();
});
// モーダル背景クリックで閉じる
document.getElementById('rejectModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeRejectModal();
});

fetchDashboard();
_dashboardTimer = setInterval(() => { if (autoRefreshEnabled) fetchDashboard(); }, AUTO_REFRESH_INTERVAL_MS);
_approvalsTimer = setInterval(() => { if (autoRefreshEnabled && currentTab === 'approvals') fetchApprovals(); }, AUTO_REFRESH_INTERVAL_MS);
</script>
</body>
</html>
